[project]
name = "langchain-project"
version = "0.1.0"
description = "A runnable tour of LangChain v1's core components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
demo = "langchain_project.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
